
name: myapp
description: "A Flutter food management app with Firebase"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_storage: ^13.4.1
  cloud_firestore: ^6.4.1
  google_sign_in: ^6.2.1

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  loading_animation_widget: ^1.3.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  share_plus: ^13.1.0

  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - images/assets/
