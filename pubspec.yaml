name: myapp
description: "A Flutter food management app with Firebase"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1

  # Google Sign In
  google_sign_in: ^6.2.1

  # UI & Utilities
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  loading_animation_widget: ^1.3.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  share_plus: ^12.0.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/assets/